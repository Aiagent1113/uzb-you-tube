name: Build UzDub YouTube AI APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Node.js & Obfuscate JS Engine
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Obfuscated Injection Script
        run: |
          cd injection/scripts
          node obfuscate.js

      - name: Set Executable Permissions on Gradle Wrapper
        run: |
          chmod +x flutter_app/android/gradlew

      - name: Install Flutter Dependencies
        run: |
          cd flutter_app
          flutter pub get

      - name: Build Release APK
        id: build_step
        run: |
          cd flutter_app
          flutter build apk --release --verbose > build_log.txt 2>&1

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: UzDub-YouTube-AI-Release-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Commit Build Log on Failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          tail -n 300 flutter_app/build_log.txt > last_error.txt
          git checkout -b build-log
          git add last_error.txt
          git commit -m "ci: record failure log"
          git push -f origin build-log
