name: Build UzDub YouTube AI APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Node.js & Obfuscate JS Engine
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Obfuscated Injection Script
        run: |
          cd injection/scripts
          node obfuscate.js

      - name: Set Executable Permissions on Gradle Wrapper
        run: |
          chmod +x flutter_app/android/gradlew

      - name: Install Flutter Dependencies
        run: |
          cd flutter_app
          flutter pub get

      - name: Build Release APK
        run: |
          cd flutter_app
          mkdir -p build/app/outputs/symbols
          flutter build apk --release --obfuscate --split-debug-info=build/app/outputs/symbols --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UzDub-YouTube-AI-Release-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "UzDub YouTube AI v1.0.0 (Release APK)"
          body: "🚀 UzDub YouTube AI rasmiy Android ilovasi. Smartfoningizga yuklab olib o'rnating!"
          files: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Commit Build Log on Failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cd flutter_app
          flutter build apk --release --android-skip-build-dependency-validation -v > error.log 2>&1 || true
          tail -n 250 error.log > ../last_error.txt
          cd ..
          git checkout -b build-log
          git add last_error.txt
          git commit -m "ci: record failure log"
          git push -f origin build-log
