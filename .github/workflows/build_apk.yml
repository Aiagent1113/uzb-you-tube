name: Build UzDub YouTube AI APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Obfuscated Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Node.js & Obfuscate JS Engine
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Obfuscated Injection Script
        run: |
          cd injection/scripts
          node obfuscate.js

      - name: Set Executable Permissions on Gradle Wrapper
        run: |
          chmod +x flutter_app/android/gradlew

      - name: Install Flutter Dependencies
        run: |
          cd flutter_app
          flutter pub get

      - name: Build Release APK with Obfuscation
        run: |
          mkdir -p build/symbols
          cd flutter_app
          flutter build apk --release --obfuscate --split-debug-info=../build/symbols

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UzDub-YouTube-AI-Release-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
